[project]
name = "bookweaver"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.12.12",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
# Focused baseline: removed E722 (bare except) to enforce proper error handling
ignore = ["E501", "F401", "F541", "F841", "I001"]
# E501: line too long (conflicts with auto-formatters)
# F401: unused imports (acceptable during development)
# F541: f-string without placeholders (stylistic choice)
# F841: unused variables (acceptable for out-of-order development)
# I001: import ordering (conflicts with auto-formatters)
