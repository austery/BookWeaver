[project]
name = "bookweaver"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "any-llm-sdk[anthropic,gemini,openai]==1.46.0",
    "google-genai>=2.17.0",
]

[project.scripts]
bookweaver = "ai.cli:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["ai*"]

[tool.setuptools.package-data]
ai = ["config_schema.json"]

[dependency-groups]
dev = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.12.12",
    "tach>=0.34.0",
    "uvicorn>=0.54.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "ANN"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "F541",   # f-string without placeholders (stylistic)
    "F841",   # unused variables (acceptable in dev)
    "I001",   # import ordering (handled by formatter)
]
# NOTE: F401 (unused imports) is intentionally NOT in ignore — unused imports are now errors.
