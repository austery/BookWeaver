[project]
name = "bookweaver"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.12.12",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
# Transitional baseline for existing legacy violations; tighten over time.
ignore = ["E501", "E722", "F401", "F541", "F841", "I001"]
