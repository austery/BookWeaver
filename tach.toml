# BookWeaver Hexagonal Architecture Boundaries
# Enforces Ports & Adapters dependency rules for ai/ sub-packages.
# Current application Modules are explicit; remaining legacy Modules are incremental adoption.

exclude = [
  "**/__pycache__",
  "tests/",
  "venv/",
  ".venv/",
  "tmp/",
  "docs/",
]

source_roots = ["."]
exact = true                        # an unused declared dependency fails
ignore_type_checking_imports = true
forbid_circular_dependencies = true

# ── Ports: no internal dependencies ──────────────────────────
[[modules]]
path = "ai.ports"
depends_on = []

# ── Core domain: depends ONLY on ports ───────────────────────
[[modules]]
path = "ai.core"
depends_on = ["ai.ports"]

# ── Adapters: depend ONLY on ports ───────────────────────────
[[modules]]
path = "ai.adapters"
depends_on = ["ai.ports", "ai.epub_package"]

# ── Shared utilities: importable from anywhere ───────────────
[[modules]]
path = "ai.shared"
utility = true

# Current invocation composition.
[[modules]]
path = "ai.orchestration"
depends_on = ["ai.ports", "ai.core", "ai.adapters", "ai.checkpoint_store", "ai.model_profiles", "ai.runtime_factory", "ai.runtime_config", "ai.prompt_preparation", "ai.term_panel", "ai.term_extraction", "ai.resume"]

[[modules]]
path = "ai.runtime_factory"
depends_on = ["ai.ports", "ai.adapters", "ai.model_profiles"]

[[modules]]
path = "ai.runtime_config"
depends_on = ["ai.core"]

[[modules]]
path = "ai.checkpoint_store"
depends_on = []

# Resume session (SPEC-029): the one owner of checkpoint verify, restore and commit.
[[modules]]
path = "ai.resume"
depends_on = ["ai.checkpoint_store", "ai.model_profiles", "ai.ports"]

[[modules]]
path = "ai.model_profiles"
depends_on = ["ai.ports"]

[[modules]]
path = "ai.prompt_preparation"
depends_on = ["ai.glossary_injector"]

[[modules]]
path = "ai.epub_package"
depends_on = []

[[modules]]
path = "ai.glossary_extractor"
depends_on = ["ai.core", "ai.epub_package"]

# Which glossary a run uses: a supplied file, one extraction model, or a Term Panel.
[[modules]]
path = "ai.term_extraction"
depends_on = ["ai.ports", "ai.model_profiles", "ai.glossary_extractor", "ai.term_panel"]

# Term Panel runner (SPEC-028): its only output is a glossary file. `bookweaver terms` and
# `--term-panel` reach it through ai.orchestration; ai.term_extraction plans it.
[[modules]]
path = "ai.term_panel"
depends_on = ["ai.ports", "ai.core", "ai.model_profiles", "ai.glossary_extractor"]

[[modules]]
path = "ai.glossary_injector"
depends_on = ["ai.core"]

[[modules]]
path = "ai.cli"
depends_on = ["ai.orchestration", "ai.local_api"]

[[modules]]
path = "ai.local_api"
depends_on = ["ai.orchestration"]
